<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sheetbox – your Excel files, sorted by date</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='9' height='9' fill='%231F7A54'/%3E%3Crect x='13' y='2' width='9' height='9' fill='none' stroke='%231F7A54' stroke-width='2'/%3E%3Crect x='2' y='13' width='9' height='9' fill='none' stroke='%231F7A54' stroke-width='2'/%3E%3Crect x='13' y='13' width='9' height='9' fill='none' stroke='%231F7A54' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <header class="top">
      <a class="brand" href="./" aria-label="Sheetbox home">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="2" width="9" height="9" fill="currentColor"/>
          <rect x="13" y="2" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="2" y="13" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="13" y="13" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>Sheetbox</span>
      </a>
      <div id="user-bar" class="user-bar" hidden>
        <span id="user-name"></span>
        <button type="button" id="logout" class="link">Log out</button>
      </div>
    </header>

    <main>

      <!-- Log in / Create account -->
      <section id="auth-view" aria-labelledby="auth-title">
        <h1 id="auth-title">Your Excel files, sorted by date</h1>
        <p class="lede">Log in with your phone number, or create an account to start uploading.</p>

        <div class="sheet">
          <div class="tabs" role="tablist" aria-label="Account">
            <button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="login-form">Log in</button>
            <button type="button" role="tab" id="tab-register" aria-selected="false" aria-controls="register-form" tabindex="-1">Create account</button>
          </div>

          <form id="login-form" class="pad" role="tabpanel" aria-labelledby="tab-login">
            <label class="field">
              <span>Phone number</span>
              <input id="login-phone" type="tel" autocomplete="username" required>
            </label>
            <label class="field">
              <span>Password</span>
              <input id="login-password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="btn block">Log in</button>
          </form>

          <form id="register-form" class="pad" role="tabpanel" aria-labelledby="tab-register" hidden>
            <label class="field">
              <span>Name</span>
              <input id="reg-name" type="text" autocomplete="name" maxlength="80" required>
            </label>
            <label class="field">
              <span>Phone number</span>
              <input id="reg-phone" type="tel" autocomplete="tel" required>
            </label>
            <label class="field">
              <span>Email</span>
              <input id="reg-email" type="email" autocomplete="email" required>
            </label>
            <label class="field">
              <span>Password (at least 8 characters)</span>
              <input id="reg-password" type="password" autocomplete="new-password" minlength="8" required>
            </label>
            <button type="submit" class="btn block">Create account</button>
          </form>

          <p id="auth-msg" class="msg pad-x" role="status"></p>
        </div>
      </section>

      <!-- Upload / Download -->
      <section id="app-view" hidden>
        <h1 class="sr-only">Your files</h1>

        <div class="choices" role="tablist" aria-label="Files">
          <button type="button" role="tab" id="tab-upload" class="choice" aria-selected="true" aria-controls="panel-upload">
            <strong>Upload</strong>
            <span>Add Excel files to your account</span>
          </button>
          <button type="button" role="tab" id="tab-download" class="choice" aria-selected="false" aria-controls="panel-download" tabindex="-1">
            <strong>Download</strong>
            <span>Get your files, grouped by date</span>
          </button>
        </div>

        <div id="panel-upload" class="sheet pad" role="tabpanel" aria-labelledby="tab-upload">
          <form id="upload-form">
            <label class="drop" id="drop" for="file-input">
              <input id="file-input" type="file" accept=".xlsx,.xls,.xlsm,.xlsb" multiple>
              <strong>Choose Excel files</strong>
              <span>or drop them here. Up to 10 MB each.</span>
            </label>
            <ul id="picked" class="picked"></ul>
            <button type="submit" id="upload-btn" class="btn" disabled>Upload</button>
          </form>
          <p id="upload-msg" class="msg" role="status"></p>
        </div>

        <div id="panel-download" class="sheet pad" role="tabpanel" aria-labelledby="tab-download" hidden>
          <div id="file-list"></div>
          <p id="download-msg" class="msg" role="status"></p>
        </div>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
